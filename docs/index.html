<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#111918" />
    <meta
      name="description"
      content="HEA — duel sihir 3D melawan IGNIS. Terbang bebas, shield directional, sihir homing, dan arena destruktibel yang luas. Mainkan dengan kontrol sentuh atau keyboard."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>HEA — Arcane Arena</title>
    <script type="module" crossorigin src="./assets/game-ChxsYyE1.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/three-DLzayhPa.js">
    <link rel="modulepreload" crossorigin href="./assets/rig101172-DNUE8GuE.js">
    <link rel="stylesheet" crossorigin href="./assets/rig101172-Dw5v3Ile.css">
    <link rel="stylesheet" crossorigin href="./assets/game-BCE3VQo5.css">
  </head>
  <body>
    <div id="app">
      <div
        data-startup-fallback
        role="status"
        style="
          min-height: 100vh;
          display: grid;
          place-content: center;
          gap: 18px;
          padding: 24px;
          background: #111918;
          color: #edf4e9;
          font: 16px sans-serif;
          text-align: center;
        "
      >
        <strong style="font-size: 36px">HEA.</strong>
        <p id="startup-message">Memuat aplikasi HEA…</p>
        <button
          type="button"
          onclick="location.replace(location.pathname + '?reload=' + Date.now())"
          style="
            padding: 14px;
            border: 1px solid #d9f48e;
            background: #d9f48e;
            color: #111918;
            border-radius: 8px;
          "
        >
          Muat ulang aplikasi
        </button>
      </div>
    </div>
    <script>
      setTimeout(function () {
        var message = document.getElementById('startup-message');
        if (message) message.textContent = 'File aplikasi belum berhasil dimuat. Coba muat ulang.';
      }, 12000);
    </script>
  </body>
</html>
